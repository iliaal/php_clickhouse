name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate metadata and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: composer, phpize
          coverage: none
      - run: composer validate --strict
      - name: Verify generated arginfo
        run: |
          phpize
          php build/gen_stub.php clickhouse.stub.php
          git diff --exit-code -- clickhouse_arginfo.h

  pie-smoke:
    name: PIE install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - name: Install PIE build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison libtool-bin
      - name: Download PIE
        run: |
          # Pinned to pie 1.4.10. Update procedure: pick the new tag from
          # https://github.com/php/pie/releases, download that tag's pie.phar,
          # refresh the sha256 below, and sanity-check with `php pie.phar --version`.
          curl -fsSL -o /tmp/pie.phar https://github.com/php/pie/releases/download/1.4.10/pie.phar
          echo "b88792235c8e80be568436d4cb043b49fd1869c89b64e83d23e2882ae19d70a8  /tmp/pie.phar" | sha256sum -c -
          chmod +x /tmp/pie.phar
      - name: PIE build smoke (base, no TLS)
        run: |
          php /tmp/pie.phar repository:add path .
          php /tmp/pie.phar build iliaal/php_clickhouse:*@dev
          so=$(find "$PWD" /tmp "$RUNNER_TEMP" -name clickhouse.so -print -quit 2>/dev/null || true)
          if [ -z "$so" ]; then echo "::error::PIE build produced no clickhouse.so"; exit 1; fi
          php -n -d extension="$so" -r 'exit(extension_loaded("clickhouse") && class_exists("ClickHouse") ? 0 : 1);'

  linux:
    name: PHP ${{ matrix.php }} - Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    services:
      clickhouse:
        image: clickhouse/clickhouse-server@sha256:fdc22372465a336fa47e9deab61fad8277b9e2f2473234a1294b33b53f01d377
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWORD: test
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          extensions: none, dom, json, xml, simplexml, tokenizer
          coverage: none

      - name: Install OpenSSL dev (TLS build path)
        run: sudo apt-get update -qq && sudo apt-get install -y libssl-dev

      - name: Naming-consistency guard (no stray legacy references)
        run: |
          ./scripts/test-naming-guard.sh
          ./scripts/check-no-seasclick.sh
          ./scripts/test-release-binary.sh

      # Every hand-edit under lib/clickhouse-cpp must have a patch file and a
      # LOCAL_PATCHES.md entry, or the next library bump drops it silently.
      - name: Vendored patch-set integrity
        run: ./scripts/check-vendored-patches.sh

      - name: Build extension (no TLS)
        run: |
          phpize
          ./configure --enable-clickhouse
          make -j$(nproc)
          ./scripts/check-exported-symbols.sh modules/clickhouse.so

      - name: Verify ClickHouse is reachable (guard against silent all-skip)
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
        run: |
          # _clickhouse.inc skips the whole suite when the native port is
          # unreachable, and run-tests.php exits 0 on an all-skip run, so a
          # dead server would give a false green. Fail fast if the port is
          # closed. Auth failures surface as FAILs, so the port check suffices.
          for i in $(seq 1 30); do
            if php -r 'exit(@fsockopen(getenv("CLICKHOUSE_HOST"), (int)getenv("CLICKHOUSE_PORT"), $e, $s, 2) ? 0 : 1);'; then
              echo "ClickHouse reachable on ${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}"; exit 0
            fi
            echo "waiting for ClickHouse native port... ($i)"; sleep 2
          done
          echo "ClickHouse not reachable on native port; failing to avoid a silent all-skip pass"; exit 1

      - name: Run test suite
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWD: test
          NO_INTERACTION: 1
        run: |
          # Stage the built .so into the system extension_dir so
          # run-tests.php's --EXTENSIONS-- clickhouse directive resolves
          # via the standard $ext_dir/clickhouse.so path on every PHP
          # version. Loading via -d extension=$(pwd)/modules/clickhouse.so
          # tripped PHP 7.4 dl.c's extension_dir prepend; overriding
          # extension_dir breaks the system dom/xml/phar/etc that
          # setup-php loads by basename.
          EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
          sudo cp modules/clickhouse.so "$EXT_DIR/"
          export TEST_PHP_EXECUTABLE=$(which php)
          # run-tests.php exits non-zero on failures, zero on all-pass /
          # all-skip. Let its exit code drive the step.
          set -o pipefail
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK,SKIP tests/ \
            | tee "$RUNNER_TEMP/phpt.out"
          scripts/assert-phpt-summary.sh "$RUNNER_TEMP/phpt.out" \
            tests/027.phpt tests/064.phpt tests/070.phpt tests/188.phpt \
            tests/207_reentrant_ssl_ca_files.phpt \
            tests/209_windows_x86_config_bounds.phpt \
            tests/216_ssl_ca_files_invalid_type.phpt

      - name: Rebuild with TLS and run the TLS suite
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_TLS_PORT: 9440
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWD: test
          NO_INTERACTION: 1
        run: |
          set -e
          # Self-signed cert for the TLS lane. The verification test trusts this
          # CA and checks both the valid 127.0.0.1 SAN and a 127.0.0.2 mismatch;
          # generate it fresh so no private key lives in the repo.
          mkdir -p "$RUNNER_TEMP/ch-certs"
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$RUNNER_TEMP/ch-certs/server.key" \
            -out "$RUNNER_TEMP/ch-certs/server.crt" -days 3650 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          chmod 644 "$RUNNER_TEMP/ch-certs/server.key" "$RUNNER_TEMP/ch-certs/server.crt"
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$RUNNER_TEMP/ch-certs/wrong.key" \
            -out "$RUNNER_TEMP/ch-certs/wrong.crt" -days 3650 \
            -subj "/CN=wrong-ca"
          chmod 644 "$RUNNER_TEMP/ch-certs/wrong.key" "$RUNNER_TEMP/ch-certs/wrong.crt"

          # The services: clickhouse container is plaintext-only, and service
          # containers start before any step runs, so they can't mount a cert
          # generated here. Run the TLS server manually: native TLS on 9440,
          # plaintext HTTP on host 8124 (container 8123) as a readiness probe.
          docker run -d --name clickhouse-tls \
            --ulimit nofile=262144:262144 \
            -p 9440:9440 -p 8124:8123 \
            -e CLICKHOUSE_USER=test -e CLICKHOUSE_PASSWORD=test \
            -v "$RUNNER_TEMP/ch-certs":/etc/clickhouse-server/certs:ro \
            -v "$PWD/tests/tls/tls.xml":/etc/clickhouse-server/config.d/tls.xml:ro \
            clickhouse/clickhouse-server@sha256:fdc22372465a336fa47e9deab61fad8277b9e2f2473234a1294b33b53f01d377

          # Rebuild the extension with TLS support while the server boots.
          make clean
          phpize --clean
          phpize
          ./configure --enable-clickhouse --enable-clickhouse-openssl
          make -j$(nproc)

          # Wait for the TLS server to be ready (plaintext HTTP ping on 8124).
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8124/ping >/dev/null; then
              echo "TLS server ready"; break
            fi
            sleep 2
          done

          # Stage the TLS-enabled .so (over the no-TLS one) and run the TLS
          # round-trip and certificate-verification tests against 9440.
          EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
          sudo cp modules/clickhouse.so "$EXT_DIR/"
          export TEST_PHP_EXECUTABLE=$(which php)
          export CLICKHOUSE_TLS_SKIP_VERIFY=0
          export CLICKHOUSE_TLS_CA_FILE="$RUNNER_TEMP/ch-certs/server.crt"
          export CLICKHOUSE_TLS_WRONG_CA_FILE="$RUNNER_TEMP/ch-certs/wrong.crt"
          # run-tests.php exits 0 on all-skip, so a skipped 027 (no TLS server /
          # no TLS build) would pass this step silently. Capture the summary and
          # require all four tests actually ran and passed.
          out=$(php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK \
            tests/027.phpt \
            tests/188.phpt \
            tests/207_reentrant_ssl_ca_files.phpt \
            tests/216_ssl_ca_files_invalid_type.phpt 2>&1) || true
          echo "$out"
          skipped=$(echo "$out" | sed -n 's/.*Tests skipped *: *\([0-9]\{1,\}\).*/\1/p' | head -1)
          passed=$(echo "$out" | sed -n 's/.*Tests passed *: *\([0-9]\{1,\}\).*/\1/p' | head -1)
          if [ "$skipped" != "0" ]; then
            echo "::error::a TLS test was skipped -- server unreachable or extension built without TLS"; exit 1
          fi
          if [ "$passed" != "4" ]; then
            echo "::error::TLS verification suite did not pass all four tests (passed=$passed)"; exit 1
          fi

          docker rm -f clickhouse-tls

  linux-zts:
    name: PHP ${{ matrix.php }} ZTS - Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    services:
      clickhouse:
        image: clickhouse/clickhouse-server@sha256:fdc22372465a336fa47e9deab61fad8277b9e2f2473234a1294b33b53f01d377
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWORD: test
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y re2c bison autoconf libssl-dev

      - name: Build PHP from source with --enable-zts
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          # Pinned php-src commits (one per branch). Update procedure: run
          # `git ls-remote https://github.com/php/php-src.git PHP-X.Y` and
          # refresh the SHA for that branch.
          case "$PHP_VERSION" in
            7.4) PHP_SRC_SHA=004cb827501d1ddaf98daacb185a53e0816f78a7 ;;
            8.0) PHP_SRC_SHA=670052c427eb08a67577789e3b00e56a4fd640a7 ;;
            8.1) PHP_SRC_SHA=6f82565f12630ba320c52c96e28160189b15ecbf ;;
            8.2) PHP_SRC_SHA=4fa25b04e76ccafda9a778f2ba2aaeb66fad1037 ;;
            8.3) PHP_SRC_SHA=7f3d3de1a280f3fb573bd7976185ea94d11be606 ;;
            8.4) PHP_SRC_SHA=13f5c4bda271d896c6ea4d1b1d2e7dfa046c9694 ;;
            8.5) PHP_SRC_SHA=dab13a022a54f8bc03302f93ccb6484907ec1245 ;;
            *) echo "::error::no pinned php-src SHA for PHP $PHP_VERSION"; exit 1 ;;
          esac
          rm -rf /tmp/php-src
          git init -q /tmp/php-src
          git -C /tmp/php-src remote add origin https://github.com/php/php-src.git
          git -C /tmp/php-src fetch --depth=1 origin "$PHP_SRC_SHA"
          git -C /tmp/php-src checkout "$PHP_SRC_SHA"
          cd /tmp/php-src
          ./buildconf --force
          php_extra=()
          if [ "$PHP_VERSION" = "7.4" ]; then
            zts_flag=--enable-maintainer-zts
            php_extra+=(--enable-json)
          else
            zts_flag=--enable-zts
          fi
          ./configure \
            "$zts_flag" \
            "${php_extra[@]}" \
            --disable-all \
            --enable-cli \
            --prefix=/tmp/php-zts
          make -j$(nproc)
          make install

      - name: Build extension under ZTS
        run: |
          export PATH="/tmp/php-zts/bin:$PATH"
          phpize
          ./configure --enable-clickhouse --with-php-config=/tmp/php-zts/bin/php-config
          make -j$(nproc)

      - name: Run test suite under ZTS
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWD: test
          NO_INTERACTION: 1
        run: |
          EXT_DIR=$(/tmp/php-zts/bin/php -r 'echo ini_get("extension_dir");')
          mkdir -p "$EXT_DIR"
          cp modules/clickhouse.so "$EXT_DIR/"
          export TEST_PHP_EXECUTABLE=/tmp/php-zts/bin/php
          set -o pipefail
          /tmp/php-zts/bin/php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK,SKIP tests/ \
            | tee "$RUNNER_TEMP/phpt-zts.out"
          scripts/assert-phpt-summary.sh "$RUNNER_TEMP/phpt-zts.out" \
            tests/027.phpt tests/064.phpt tests/070.phpt tests/188.phpt \
            tests/207_reentrant_ssl_ca_files.phpt \
            tests/209_windows_x86_config_bounds.phpt \
            tests/216_ssl_ca_files_invalid_type.phpt

  # Windows extension builds need the official PHP SDK + matching MSVC
  # toolset, not the autotools phpize/configure flow. The php-org
  # composite action below bundles SDK download, VS detection,
  # phpize / configure / nmake invocation, and a .dll smoke load.
  #
  # run-tests is enabled so the runner exercises extension load + class
  # registration + skip handling. Server-required phpts skip up-front
  # via clickhouse_skip_if_no_server() (which short-circuits on
  # PHP_OS_FAMILY === Windows). The offline surface smoke (tests/051)
  # actually runs and validates the public API and exception boundary.
  windows-matrix:
    name: Resolve Windows matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # 1.8.1
        with:
          # Mirror the release-windows.yml matrix so the pre-tag gate builds
          # every toolset we ship: PHP 8.3 uses VS2019 (vs16), 8.4/8.5 use
          # VS2022 (vs17). Building only 8.4 let a vs17-only construct ship
          # 0.8.6 without Windows binaries.
          php-version-list: '8.3, 8.4, 8.5'

  windows:
    name: Windows ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.arch }}
    needs: [windows-matrix, validate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build extension
        uses: php/php-windows-builder/extension@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # 1.8.1
        env:
          # 209 is 32-bit-only and needs no server (port-1 refusal proves the
          # bounds), so the x86 lane executes real 32-bit coverage while x64
          # lanes keep the 051-only requirement (209 skips by design there).
          REQUIRED_PHPT_TESTS: ${{ matrix.arch == 'x86' && 'tests/051.phpt tests/209_windows_x86_config_bounds.phpt' || 'tests/051.phpt' }}
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          run-tests: 'true'
          test-runner: scripts/run-tests-guard.php

  asan:
    name: PHP ${{ matrix.php }} - ASAN
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    services:
      clickhouse:
        image: clickhouse/clickhouse-server@sha256:fdc22372465a336fa47e9deab61fad8277b9e2f2473234a1294b33b53f01d377
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWORD: test
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    env:
      # detect_leaks=0: PHP's PHPT runner/tracer does not provide a reliable
      #   LeakSanitizer process boundary. A separate client lifecycle probe below
      #   runs with leak detection enabled.
      # detect_odr_violation=0: clickhouse-cpp templates produce duplicate
      #   symbols across translation units, harmless but noisy.
      # exitcode=139: keep ASan abort on the conventional SIGSEGV exit code so
      #   run-tests.php classifies failures as crashes, not silent skips.
      ASAN_OPTIONS: exitcode=139:detect_odr_violation=0:detect_leaks=0
      PHP_VERSION: ${{ matrix.php }}
      UBSAN_OPTIONS: print_stacktrace=1
      USE_ZEND_ALLOC: 0

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y llvm clang re2c bison autoconf libssl-dev

      - name: Resolve clang runtime dir
        id: clang_rt
        run: echo "dir=$(clang -print-runtime-dir)" >> "$GITHUB_OUTPUT"

      - name: Build PHP with ASAN
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          # Pinned php-src commit for the 8.4 branch (this lane builds 8.4
          # only). Update procedure: run
          # `git ls-remote https://github.com/php/php-src.git PHP-8.4` and
          # refresh the SHA below.
          PHP_SRC_SHA=13f5c4bda271d896c6ea4d1b1d2e7dfa046c9694
          rm -rf /tmp/php-src
          git init -q /tmp/php-src
          git -C /tmp/php-src remote add origin https://github.com/php/php-src.git
          git -C /tmp/php-src fetch --depth=1 origin "$PHP_SRC_SHA"
          git -C /tmp/php-src checkout "$PHP_SRC_SHA"
          cd /tmp/php-src
          ./buildconf --force
          # -shared-libasan: link ASan as a shared library so the dynamic
          # linker can resolve interceptors (notably __cxa_throw) across the
          # dlopen'd extension boundary. With static asan, the extension's
          # interceptor for __cxa_throw never finds the real libstdc++
          # symbol and ASan aborts the moment the wrapper throws.
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure \
            --enable-debug \
            --disable-zts \
            --disable-all \
            --enable-cli \
            --prefix=/tmp/php-asan
          make -j$(nproc)
          make install

      - name: Build extension with ASAN
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          export PATH="/tmp/php-asan/bin:$PATH"
          phpize
          # Match PHP's exact -fsanitize / -fno-sanitize / -shared-libasan
          # set so the runtime ABI lines up. Disable `function` (PHP's own
          # build does) and `vptr` (the vptr check needs
          # __ubsan_vptr_type_cache, which the dlopen'd extension can't
          # resolve against the host PHP's runtime). The vendored LZ4 NULL+0
          # expression is patched locally, so pointer-overflow stays enabled
          # for both extension and vendor sources.
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          CXXFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure --enable-clickhouse --with-php-config=/tmp/php-asan/bin/php-config
          make -j$(nproc)

      - name: Run tests under ASAN
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWD: test
          NO_INTERACTION: 1
        run: |
          # PHP and the extension are linked against the shared libasan/ubsan
          # runtimes, so the dynamic linker needs to find them. LD_LIBRARY_PATH
          # points at clang's runtime dir; no LD_PRELOAD is needed.
          EXT_DIR=$(/tmp/php-asan/bin/php -r 'echo ini_get("extension_dir");')
          mkdir -p "$EXT_DIR"
          cp modules/clickhouse.so "$EXT_DIR/"
          export TEST_PHP_EXECUTABLE=/tmp/php-asan/bin/php
          set -o pipefail
          /tmp/php-asan/bin/php run-tests.php --show-diff --asan -g FAIL,BORK,LEAK,XLEAK,SKIP tests/ \
            | tee "$RUNNER_TEMP/phpt-asan.out"
          scripts/assert-phpt-summary.sh "$RUNNER_TEMP/phpt-asan.out" \
            tests/027.phpt tests/064.phpt tests/070.phpt tests/188.phpt \
            tests/207_reentrant_ssl_ca_files.phpt \
            tests/209_windows_x86_config_bounds.phpt \
            tests/216_ssl_ca_files_invalid_type.phpt

      - name: Run leak-enabled client lifecycle probe
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWD: test
          ASAN_OPTIONS: exitcode=139:detect_odr_violation=0:detect_leaks=1
          LSAN_OPTIONS: exitcode=23
        run: |
          /tmp/php-asan/bin/php -n -d extension="$PWD/modules/clickhouse.so" -r '
            $c = new ClickHouse([
              "host" => getenv("CLICKHOUSE_HOST"),
              "port" => (int) getenv("CLICKHOUSE_PORT"),
              "user" => getenv("CLICKHOUSE_USER"),
              "passwd" => getenv("CLICKHOUSE_PASSWD"),
              "compression" => true,
            ]);
            if (!$c->ping() || count($c->select("SELECT number FROM numbers(2)")) !== 2) {
              exit(1);
            }
            unset($c);
            gc_collect_cycles();
          '
